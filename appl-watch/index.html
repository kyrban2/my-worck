<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="./css/main.css" />
	</head>
	<body>
		<div class="card">
			<img src="./img/apple-watch.jpg" alt="Apple Watch" class="card-img" />
			<h4 class="card-tile">Apple Watch</h4>
			<div class="card-text">
				<p>
					Смарт-часы Apple Watch Series 3 GPS 38mm
					<a href="">с белым ремешком</a> дополнят стильный образ своего
					владельца и позволят легко контролировать результаты тренировок,
					слушать музыку и общаться с друзьями.
				</p>
			</div>
			<div class="price">
				<span class="price-bold">Цена:</span>
				30 000 руб
			</div>
			<button type="button" class="btn">В корзину</button>
		</div>
